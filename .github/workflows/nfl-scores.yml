name: Update NFL Final Scores
on:
  workflow_dispatch:
  push:
    paths:
      - update_nfl_scores.py
      - test_nfl_scores.py
      - .github/workflows/nfl-scores.yml
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: nfl-final-scores
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify final-score handling
        run: python -m unittest test_nfl_scores -v
      - name: Build score guide
        run: python update_nfl_scores.py
      - name: Save guide
        uses: actions/upload-artifact@v4
        with:
          name: nfl-scores
          path: scores-output/
          retention-days: 3
      - name: Update hosted guide files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores-output/nfl-scores.xml scores-output/nfl-scores.xml.gz
          if ! git diff --cached --quiet; then
            git commit -m "Update NFL final scores"
            git push
          fi
