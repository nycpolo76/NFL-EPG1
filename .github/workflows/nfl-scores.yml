name: Update NFL Final Scores
on:
  workflow_dispatch:
  push:
    paths:
      - update_nfl_scores.py
      - test_nfl_scores.py
      - .github/workflows/nfl-scores.yml
  schedule:
    - cron: '15 11,13,16,19 * * *'
      timezone: 'America/New_York'
permissions:
  contents: write
concurrency:
  group: nfl-final-scores
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify final-score handling
        run: python -m unittest test_nfl_scores -v
      - name: Build score guide
        run: python update_nfl_scores.py
      - name: Save guide
        uses: actions/upload-artifact@v4
        with:
          name: nfl-scores
          path: scores-output/
          retention-days: 3
      - name: Update hosted guide files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve the freshly generated output outside this disposable checkout.
          guide_stage="$(mktemp -d)"
          cp scores-output/nfl-scores.xml scores-output/nfl-scores.xml.gz "$guide_stage/"
          trap 'rm -rf "$guide_stage"' EXIT
          for attempt in 1 2 3; do
            # Start from the current remote commit instead of merging generated files.
            git fetch origin main
            git reset --hard origin/main
            mkdir -p scores-output
            cp "$guide_stage/nfl-scores.xml" "$guide_stage/nfl-scores.xml.gz" scores-output/
            git add scores-output/nfl-scores.xml scores-output/nfl-scores.xml.gz
            if git diff --cached --quiet; then
              echo "Hosted guide is already current."
              exit 0
            fi
            git commit -m "Update NFL final scores"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Remote changed during save; retrying ($attempt/3)."
          done
          echo "::error::Could not publish guide after three attempts."
          exit 1
